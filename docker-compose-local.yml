services:
  strapi:
    build: .
    image: strapi-treinamentos:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    env_file: .env
    volumes:
      - ./public/uploads:/opt/app/public/uploads
    ports:
      - 1337:1337
    networks:
      - net_swarm

networks:
  net_swarm:
    driver: overlay
    external: true